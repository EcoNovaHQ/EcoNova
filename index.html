function makeIcon(name) {
  const node = LI[name] || [];
  return function LucideIcon({ size = 24, className = "", strokeWidth = 2, fill = "none", ...rest }) {
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg", width: size, height: size,
        viewBox: "0 0 24 24", fill: fill, stroke: "currentColor",
        strokeWidth: strokeWidth, strokeLinecap: "round", strokeLinejoin: "round",
        className: "lucide " + className, ...rest
      },
      node.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))
    );
  };
}

function CheckoutModal({ cart, onClose, onConfirm }) {
  const [form, setForm] = useState({ name:"", phone:"", address:"", payMethod:"ubl", notes:"" });
  const [done, setDone] = useState(false);
  const [err, setErr] = useState("");
  const total = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const orderLines = cart.map(i=>`• ${i.name} ×${i.qty} — ${fmt(i.price*i.qty)}`).join("\n");
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const waText = encodeURIComponent(
    `New Order — EcoNova International\n\nName: ${form.name}\nPhone: ${form.phone}\nAddress: ${form.address || "-"}\nPayment: ${form.payMethod === "ubl" ? "UBL Bank Transfer" : "EasyPaisa"}\nNotes: ${form.notes || "-"}\n\nItems:\n${orderLines}\n\nTotal: ${fmt(total)}`
  );

  const submit = () => {
    if (!form.name || !form.phone) { setErr("Please fill in your name and phone number."); return; }
    setErr("");
    setDone(true);
    onConfirm();
  };

  if (done) return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 p-4">
      <div className="bg-gray-900 rounded-2xl max-w-md w-full p-8 text-center border border-lime-500">

// ── CONTACT FORM (sends via WhatsApp) ───────────────────────────────────────
function ContactForm() {
  const [f, setF] = useState({ name:"", phone:"", subject:"", message:"" });
  const set = (k,v)=>setF(o=>({...o,[k]:v}));
  const text = encodeURIComponent(
    `Website Enquiry — EcoNova International\n\nName: ${f.name || "-"}\nPhone: ${f.phone || "-"}\nSubject: ${f.subject || "-"}\n\n${f.message || ""}`
  );
  return (
    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
      <h3 className="text-white font-bold text-lg mb-4">Send a Message</h3>
      <div className="space-y-3">
        <input value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Your Name" className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-lime-500"/>
        <input value={f.phone} onChange={e=>set("phone",e.target.value)} placeholder="Phone Number" className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-lime-500"/>
        <input value={f.subject} onChange={e=>set("subject",e.target.value)} placeholder="Subject" className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-lime-500"/>
        <textarea value={f.message} onChange={e=>set("message",e.target.value)} placeholder="Your message..." rows={4} className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-lime-500 resize-none"/>
        <a href={`https://wa.me/923098773221?text=${text}`} target="_blank" rel="noreferrer"
          className="w-full bg-lime-400 text-green-900 font-black py-3 rounded-xl hover:bg-lime-300 transition-all flex items-center justify-center gap-2">
          <MessageCircle size={18}/> Send via WhatsApp
        </a>
      </div>
    </div>
  );
}
